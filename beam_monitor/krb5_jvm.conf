# krb5.conf for the NXCALS watcher's JVM ONLY (java.security.krb5.conf points
# here; kinit/aklog in the keepalive keep using the system /etc/krb5.conf).
#
# Why this exists: lxplus's /etc/krb5.conf.d/cern-defaults-cernch.conf sets
# proxiable = true, and the JDK builds its TGS request options from that
# config. Before contacting the KDC it checks the requested options against
# the TGT's flags and throws KrbException 101 "Invalid option setting in
# ticket request" on any mismatch. Tickets minted on banco (repo
# config/krb5_cern.conf, no proxiable) have flags FRIA — no P — so every
# pushed/forwarded/renewed banco ticket died on that client-side check, while
# a password kinit done on lxplus (P flag set) worked. Requesting neither
# forwardable nor proxiable makes the JVM accept any valid TGT; Spark runs
# local-mode here and HDFS SASL needs no delegable service tickets.
[libdefaults]
    default_realm = CERN.CH
    dns_lookup_realm = false
    dns_lookup_kdc = false
    ticket_lifetime = 25h
    renew_lifetime = 120h
    forwardable = false
    proxiable = false
    rdns = false
    permitted_enctypes = aes256-cts-hmac-sha384-192 aes128-cts-hmac-sha256-128 aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96

[realms]
    CERN.CH = {
        default_domain = cern.ch
        kpasswd_server = cerndc.cern.ch
        admin_server = cerndc.cern.ch
        kdc = cerndc.cern.ch
    }

[domain_realm]
    .cern.ch = CERN.CH
    cern.ch = CERN.CH
